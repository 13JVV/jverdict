[project]
name = "jverdict"
version = "0.1.0"
description = "정책 판정관 J-Verdict: 도정 정책의 효과를 스스로 설계·검증·판정하는 인과추론 AI Agent"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "anthropic>=0.40",
  "streamlit>=1.38",
  "plotly>=5.22",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
docs = ["markdown>=3.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
